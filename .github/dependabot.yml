version: 2
updates:
  # Rust / Cargo dependencies
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    # These crates must move together: utoipa-swagger-ui pins a specific
    # utoipa and axum major version, and bumping one alone breaks the build.
    groups:
      http-stack:
        patterns:
          - "axum*"
          - "utoipa*"
          - "tower*"
          - "tonic*"
          - "prost*"

  # Python SDK dependencies
  - package-ecosystem: pip
    directory: "/sdks/python"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python

  # Root-level requirements.txt
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  # Node.js SDK dependencies
  - package-ecosystem: npm
    directory: "/sdks/nodejs"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - nodejs

  # GitHub Actions themselves
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
