[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sievrant"
version = "0.1.0"
description = "Python SDK for Sievrant — the statistically audited retrieval decision engine"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Sievrant Team" }]
keywords = [
    "rag", "retrieval", "ai", "llm", "conformal-prediction",
    "langchain", "llama-index", "enterprise", "vector-search"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.2.0",
]
llama-index = [
    "llama-index-core>=0.10.0",
]
dspy = [
    "dspy-ai>=2.4.0",
]
all = [
    "langchain-core>=0.2.0",
    "llama-index-core>=0.10.0",
    "dspy-ai>=2.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/Nabarup1/sievrant"
Documentation = "https://github.com/Nabarup1/sievrant/tree/main/docs"
Repository = "https://github.com/Nabarup1/sievrant"
"Bug Tracker" = "https://github.com/Nabarup1/sievrant/issues"

[tool.hatch.build.targets.wheel]
packages = ["sievrant"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
