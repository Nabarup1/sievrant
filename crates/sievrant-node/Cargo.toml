[package]
name = "sievrant-node"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.14.0", default-features = false, features = ["napi4", "async", "tokio_rt"] }
napi-derive = "3.6.7"
sievrant = { workspace = true }
sievrant-core = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[build-dependencies]
napi-build = "2"
