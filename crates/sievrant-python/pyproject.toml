[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "sievrant-python"
version = "0.1.0"
description = "Native Python bindings for the Sievrant retrieval engine"
authors = [{ name = "Sievrant", email = "sievrant@example.com" }]
requires-python = ">=3.8"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "sievrant_native"
