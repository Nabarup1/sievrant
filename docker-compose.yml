services:
  # Qdrant vector database. Sievrant talks to its gRPC port (6334).
  qdrant:
    image: qdrant/qdrant:v1.15.4
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sievrant API server. Put SIEVRANT_API_KEYS and provider keys in .env.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SIEVRANT_VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6334
      SIEVRANT_DATA_DIR: /app/data
    volumes:
      - sievrant_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_storage:
  sievrant_data:
